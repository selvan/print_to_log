name: print_to_log
description: >-
  Migrates debugPrint and print calls in a Flutter or Dart package to
  package:logging. Add it as a dev dependency and run `dart run print_to_log`.
version: 1.0.0
repository: https://github.com/selvan/print_to_log
topics:
  - logging
  - migration
  - cli
  - flutter

environment:
  sdk: ^3.5.0

executables:
  print_to_log:

dependencies:
  analyzer: '>=13.1.0 <15.0.0'
  args: ^2.5.0
  path: ^1.8.3
  yaml: ^3.1.2
  yaml_edit: ^2.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
